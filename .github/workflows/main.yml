name: Interior Design CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm install

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://13.62.168.145/api' }}
        run: npm run build

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Production Server
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Validate Deployment Configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing DEPLOY_KNOWN_HOSTS secret"; exit 1; }
          [[ "$BACKEND_DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || {
            echo "BACKEND_DEPLOY_PATH must be an absolute Linux path containing only letters, numbers, _, ., /, or -."
            exit 1
          }
          [[ "$BACKEND_DEPLOY_PATH" != *"/../"* && "$BACKEND_DEPLOY_PATH" != */.. ]] || {
            echo "BACKEND_DEPLOY_PATH must not contain parent-directory segments."
            exit 1
          }

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Backend
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh_options="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$BACKEND_DEPLOY_PATH'"
          rsync -az --exclude=node_modules --exclude=.env -e "ssh $ssh_options" \
            backend/ "$DEPLOY_USER@$DEPLOY_HOST:$BACKEND_DEPLOY_PATH/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$BACKEND_DEPLOY_PATH' && npm ci --omit=dev && (npx --yes pm2 delete interior-backend >/dev/null 2>&1 || true) && npx --yes pm2 start server.js --name interior-backend --update-env"

      - name: Diagnose live API routing
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BACKEND_DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_DEPLOY_PATH='$BACKEND_DEPLOY_PATH' bash -s" <<'REMOTE'
          set +e
          echo "--- Nginx API routing directives ---"
          (sudo -n nginx -T 2>/dev/null || nginx -T 2>/dev/null) |
            grep -E "^[[:space:]]*(listen|server_name|location[[:space:]]+/api|proxy_pass|limit_except|allow|deny)" || true
          echo "--- PM2 app identity ---"
          npx --yes pm2 describe interior-backend | grep -E "status|script path|exec cwd|pid" || true
          echo "--- Deployed route source ---"
          grep -nF "app.delete('/api/clients/:email/data'" "$BACKEND_DEPLOY_PATH/server.js" || true
          echo "--- Node listeners ---"
          (sudo -n ss -lntp 2>/dev/null || ss -lntp 2>/dev/null) |
            grep -E "node|:5000|:5001|:3000|:4000" || true
          echo "--- Backend route status on likely upstream ports (401 means route exists) ---"
          for port in 5000 5001 3000 4000; do
            printf "%s: " "$port"
            curl -sS -o /dev/null -w "%{http_code}\n" --max-time 3 -X DELETE "http://127.0.0.1:$port/api/clients/probe%40example.com/data" || true
          done
          echo "--- PM2 startup port ---"
          npx --yes pm2 logs interior-backend --lines 40 --nostream 2>&1 |
            grep -E "Server running on port" | tail -n 3 || true
          REMOTE

      - name: Resolve Nginx frontend root
        id: nginx-root
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n nginx -T 2>/dev/null || nginx -T 2>/dev/null' > "$RUNNER_TEMP/nginx.conf"
          python3 .github/scripts/resolve-nginx-root.py < "$RUNNER_TEMP/nginx.conf" >> "$GITHUB_OUTPUT"

      - name: Publish frontend to Nginx root
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          NGINX_ROOT: ${{ steps.nginx-root.outputs.root }}
        run: |
          set -euo pipefail
          tar -czf - -C frontend-dist . | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n tar --no-same-owner -xzf - -C '$NGINX_ROOT'"

      - name: Verify live delete route
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          status=$(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'curl --silent --show-error --output /dev/null --write-out "%{http_code}" --max-time 10 --request DELETE http://127.0.0.1:5000/api/clients/probe%40example.com/data')
          if [[ "$status" != "401" ]]; then
            echo "Expected the backend admin route to return 401 without credentials; got HTTP $status."
            exit 1
          fi
          echo "Backend delete route is present and protected (HTTP 401 without credentials)."
